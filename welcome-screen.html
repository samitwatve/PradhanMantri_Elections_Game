<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Elections Game - Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: url('PradhanMantriBg.png') repeat-x center center/50% 95vh, linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            overflow-x: hidden;
        }

        .welcome-container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .game-title {
            color: white;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .game-subtitle {
            color: white;
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 3rem;
        }

        .step-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .step-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 1rem;
        }

        .name-input {
            width: 100%;
            max-width: 300px;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .name-input:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
        }

        .slide-container {
            position: relative;
            max-width: 400px;
            margin: 0 auto;
            perspective: 1000px;
        }

        .card-stack {
            position: relative;
            width: 100%;
            height: 650px;
        }

        .card-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #ffffff;
            border-radius: 1.25rem;
            border: 3px solid #f97316;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-container.selected {
            border-color: #16a34a;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.3), 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .politician-image-container {
            aspect-ratio: 1 / 1;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .politician-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .card-content {
            padding: 1.5rem;
        }

        .politician-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .politician-party {
            color: #6b7280;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .policies-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.375rem;
            margin-top: 1rem;
        }

        .policy-item-wrapper {
            background: rgba(249, 115, 22, 0.1);
            border-radius: 6px;
            padding: 0.4rem 0.6rem;
            text-align: center;
            border: 1px solid rgba(249, 115, 22, 0.2);
        }

        .policy-label {
            color: #ea580c;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            line-height: 1.2;
        }

        .policy-score {
            color: #ea580c;
            font-size: 0.75rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .navigation-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .select-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .select-btn:hover {
            background: #15803d;
            transform: translateY(-2px);
        }

        .start-game-btn {
            background: #f97316;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 2rem;
        }

        .start-game-btn:hover {
            background: #ea580c;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.3);
        }

        .start-game-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .selection-summary {
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 2rem;
        }

        .ai-opponent {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .hidden {
            display: none;
        }

        /* Card positioning classes */
        .card-container.active {
            transform: translateX(0) scale(1);
            z-index: 10;
            opacity: 1;
        }

        .card-container.prev {
            transform: translateX(-100%) scale(0.9);
            z-index: 5;
            opacity: 0.7;
        }

        .card-container.next {
            transform: translateX(100%) scale(0.9);
            z-index: 5;
            opacity: 0.7;
        }

        .card-container.hidden {
            transform: translateX(0) scale(0.8);
            z-index: 1;
            opacity: 0;
        }
    </style>
</head>
<body class="antialiased">
    <div class="welcome-container">
        <h1 class="game-title">India Elections Game</h1>
        <p class="game-subtitle">Choose your politician and lead your party to victory!</p>

        <!-- Step 1: Player Name Input -->
        <div class="step-container" id="step-1">
            <h2 class="step-title">Step 1: Enter Your Name</h2>
            <input 
                type="text" 
                class="name-input" 
                id="player-name" 
                placeholder="Enter your name..." 
                maxlength="20"
                required
            >
            <div class="mt-4">
                <button class="select-btn" onclick="proceedToSelection()">Continue</button>
            </div>
        </div>

        <!-- Step 2: Politician Selection -->
        <div class="step-container hidden" id="step-2">
            <h2 class="step-title">Step 2: Choose Your Politician</h2>
            <p class="text-gray-600 mb-4">Browse through the candidates and select who you want to represent</p>
            
            <div class="slide-container">
                <div id="card-stack" class="card-stack">
                    <!-- Cards will be dynamically inserted here -->
                </div>
            </div>

            <div class="navigation-controls">
                <button id="prev-btn" class="nav-btn">← Previous</button>
                <button class="select-btn" onclick="selectCurrentPolitician()">Select This Politician</button>
                <button id="next-btn" class="nav-btn">Next →</button>
            </div>
        </div>

        <!-- Step 3: Game Summary -->
        <div class="step-container hidden" id="step-3">
            <h2 class="step-title">Step 3: Game Setup Complete!</h2>
            
            <div class="selection-summary">
                <h3 class="text-lg font-semibold text-green-800 mb-2">Your Selection</h3>
                <div id="player-summary" class="flex items-center justify-center gap-4">
                    <!-- Player selection will be shown here -->
                </div>
            </div>

            <div class="ai-opponent">
                <h3 class="text-lg font-semibold text-red-800 mb-2">AI Opponent</h3>
                <div id="ai-summary" class="flex items-center justify-center gap-4">
                    <!-- AI selection will be shown here -->
                </div>
            </div>

            <button class="start-game-btn" onclick="startGame()">Start Game!</button>
        </div>
    </div>

    <script>
        let politicians = [];
        let currentIndex = 0;
        let selectedPolitician = null;
        let aiPolitician = null;
        let playerName = '';

        // Load politicians data on page load
        async function loadPoliticians() {
            try {
                const response = await fetch('politicians-data.json');
                const data = await response.json();
                politicians = data.politicians;
                createCards();
                updateCardPositions();
            } catch (error) {
                console.error('Error loading politicians data:', error);
            }
        }

        function createCards() {
            const cardStack = document.getElementById('card-stack');
            cardStack.innerHTML = '';

            politicians.forEach((politician, index) => {
                const card = document.createElement('div');
                card.className = 'card-container';
                card.setAttribute('data-index', index);
                
                const borderColor = politician.primaryColor || '#f97316';
                
                card.innerHTML = `
                    <div class="politician-image-container">
                        <img src="${politician.image}" alt="${politician.name}" class="politician-image">
                    </div>
                    <div class="card-content">
                        <h3 class="politician-name">${politician.name}</h3>
                        <p class="politician-party">${politician.party}</p>
                        <div class="policies-grid">
                            ${politician.policies.slice(0, 6).map(policy => `
                                <div class="policy-item-wrapper">
                                    <div class="policy-label">${policy.name}</div>
                                    <div class="policy-score">${policy.progress}%</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
                // Apply custom border color
                card.style.borderColor = borderColor;
                
                cardStack.appendChild(card);
            });

            // Add navigation event listeners
            document.getElementById('prev-btn').addEventListener('click', () => {
                currentIndex = (currentIndex - 1 + politicians.length) % politicians.length;
                updateCardPositions();
            });

            document.getElementById('next-btn').addEventListener('click', () => {
                currentIndex = (currentIndex + 1) % politicians.length;
                updateCardPositions();
            });
        }

        function updateCardPositions() {
            const cards = document.querySelectorAll('.card-container');
            cards.forEach((card, index) => {
                card.classList.remove('active', 'prev', 'next', 'hidden');
                
                if (index === currentIndex) {
                    card.classList.add('active');
                } else if (index === currentIndex - 1) {
                    card.classList.add('prev');
                } else if (index === currentIndex + 1) {
                    card.classList.add('next');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        function proceedToSelection() {
            const nameInput = document.getElementById('player-name');
            playerName = nameInput.value.trim();
            
            if (!playerName) {
                alert('Please enter your name!');
                return;
            }

            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
        }

        function selectCurrentPolitician() {
            selectedPolitician = politicians[currentIndex];
            
            // Randomly select AI opponent from different party
            const availableOpponents = politicians.filter(p => 
                p.party !== selectedPolitician.party && p.id !== selectedPolitician.id
            );
            
            if (availableOpponents.length === 0) {
                alert('No available opponents from different parties!');
                return;
            }

            aiPolitician = availableOpponents[Math.floor(Math.random() * availableOpponents.length)];
            
            showGameSummary();
        }

        function showGameSummary() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.remove('hidden');

            // Show player selection
            document.getElementById('player-summary').innerHTML = `
                <img src="${selectedPolitician.image}" alt="${selectedPolitician.name}" class="w-16 h-16 rounded-full object-cover">
                <div class="text-left">
                    <div class="font-semibold">${playerName} as ${selectedPolitician.name}</div>
                    <div class="text-sm text-gray-600">${selectedPolitician.party}</div>
                </div>
            `;

            // Show AI selection
            document.getElementById('ai-summary').innerHTML = `
                <img src="${aiPolitician.image}" alt="${aiPolitician.name}" class="w-16 h-16 rounded-full object-cover">
                <div class="text-left">
                    <div class="font-semibold">AI as ${aiPolitician.name}</div>
                    <div class="text-sm text-gray-600">${aiPolitician.party}</div>
                </div>
            `;
        }

        function startGame() {
            // Store selections in localStorage for the main game
            const gameConfig = {
                playerName: playerName,
                player1Politician: selectedPolitician,
                player2Politician: aiPolitician
            };
            
            localStorage.setItem('gameConfig', JSON.stringify(gameConfig));
            
            // Redirect to main game
            window.location.href = 'index.html';
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadPoliticians);

        // Allow Enter key to proceed from name input
        document.getElementById('player-name').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                proceedToSelection();
            }
        });
    </script>
</body>
</html>
